<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0d0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Sumo in a volcano — shove your friends into the lava. 90-second matches, one thumb." />
    <title>Splash Sumo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌋</text></svg>" />
    <!-- Loading screen styles live here (not style.css) so it paints before the game code arrives. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0d0a; }
      #boot {
        position: fixed; inset: 0; z-index: 5; overflow: hidden; box-sizing: border-box;
        display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        padding: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
          calc(22px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
        font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff6ec; text-align: center;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        background: radial-gradient(ellipse 90% 55% at 50% 118%, #b8280a 0%, rgba(90, 20, 8, 0) 70%), #1a0d0a;
      }
      #boot.hidden { display: none; }
      #boot.ready { cursor: pointer; }
      #boot > * { position: relative; z-index: 2; }
      /* Key art: fades in once downloaded, then drifts very slowly. */
      #boot .boot-bg {
        position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: 50% 40%;
        opacity: 0; transition: opacity 0.6s ease-out;
        animation: boot-drift 24s ease-in-out infinite alternate;
      }
      #boot .boot-bg.in { opacity: 1; }
      #boot::before { /* darken the top-left corner for the logo and the bottom for the bar */
        content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse 55% 60% at 0% 0%, rgba(14, 6, 4, 0.82), rgba(14, 6, 4, 0) 70%),
          linear-gradient(180deg, rgba(14, 6, 4, 0) 58%, rgba(14, 6, 4, 0.9) 100%);
      }
      /* ---- Logo ---- */
      .boot-logo { align-self: flex-start; display: flex; flex-direction: column; align-items: flex-start; gap: clamp(4px, 1.4vh, 10px); }
      #boot .splash-title {
        margin: 0; font-weight: 900; line-height: 0.84; letter-spacing: -0.01em; text-align: left;
        transform: rotate(-4deg); transform-origin: 0 100%;
      }
      .boot-l1, .boot-l2 {
        display: block;
        filter: drop-shadow(2px 0 0 #2a0e06) drop-shadow(-2px 0 0 #2a0e06) drop-shadow(0 2px 0 #2a0e06)
          drop-shadow(0 -2px 0 #2a0e06) drop-shadow(0 5px 0 #2a0e06) drop-shadow(0 10px 14px rgba(0, 0, 0, 0.55));
      }
      .boot-l1 { font-size: clamp(30px, min(6.4vw, 11vh), 62px); color: #fff6ec; padding-left: 0.08em; }
      .boot-l2 {
        font-size: clamp(46px, min(10vw, 17vh), 96px); padding-right: 0.06em;
        background: linear-gradient(180deg, #ffe680 0%, #ffb020 34%, #ff6a1a 64%, #d22f0a 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .boot-tag {
        margin: 0; padding: 5px 12px; border-radius: 999px; font-size: clamp(11px, 1.6vw, 14px); font-weight: 800;
        background: rgba(26, 13, 10, 0.72); border: 1px solid rgba(255, 176, 32, 0.45);
      }
      /* ---- Bottom: tip, bar, tap ---- */
      .boot-bottom { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 7px; }
      .boot-tip { margin: 0; min-height: 1.3em; font-size: clamp(12px, 1.8vw, 15px); font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
      .boot-tip::before { content: "💡 "; }
      .boot-bar {
        width: 100%; height: 18px; box-sizing: border-box; padding: 3px; border-radius: 999px; overflow: hidden;
        background: rgba(20, 8, 5, 0.85); border: 2px solid #ffcf7a;
        box-shadow: 0 0 0 2px #2a0e06, 0 6px 16px rgba(0, 0, 0, 0.5);
      }
      .boot-bar i {
        display: block; height: 100%; width: 0; border-radius: 999px;
        background:
          repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.22) 0 8px, rgba(255, 255, 255, 0) 8px 16px),
          linear-gradient(180deg, #ffe680, #ffb020 45%, #ff6a1a);
        background-size: 22.6px 100%, 100% 100%;
        animation: boot-creep 6s cubic-bezier(0.1, 0.6, 0.3, 1) forwards, boot-stripes 0.8s linear infinite;
      }
      #boot.js .boot-bar i { animation: boot-stripes 0.8s linear infinite; transition: width 0.35s ease-out; }
      .boot-meta { width: 100%; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #ffe2c4; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
      #boot .splash-tap {
        display: none; margin: 2px 0 0; padding: 10px 34px; border-radius: 999px; font-size: 22px; font-weight: 900;
        background: linear-gradient(180deg, #ff8a3d, #e5430f); box-shadow: 0 4px 0 #8f2606, 0 10px 24px rgba(255, 90, 20, 0.4);
        animation: boot-pulse 1.1s ease-in-out infinite alternate;
      }
      #boot.ready .boot-bar, #boot.ready .boot-meta { display: none; }
      #boot.ready .splash-tap { display: block; }
      #boot .splash-foot {
        position: absolute; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
        margin: 0; font-size: 10px; color: rgba(255, 246, 236, 0.65); letter-spacing: 0.06em;
      }
      @keyframes boot-creep { from { width: 4%; } to { width: 40%; } }
      @keyframes boot-stripes { to { background-position: 22.6px 0, 0 0; } }
      @keyframes boot-pulse { from { transform: scale(0.96); } to { transform: scale(1.04); } }
      @keyframes boot-drift { from { transform: scale(1); } to { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i { animation: none; width: 30%; }
        #boot.js .boot-bar i, #boot .splash-tap, #boot .boot-bg { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="boot" class="splash boot">
        <img class="boot-bg" src="/src/assets/boot/key-art.jpg" alt="" fetchpriority="high" onload="this.classList.add('in')" />
        <div class="boot-logo">
          <h1 class="splash-title" aria-label="Splash Sumo"><span class="boot-l1">SPLASH</span><span class="boot-l2">SUMO</span></h1>
          <p class="boot-tag">Shove your rivals into the lava!</p>
        </div>
        <div class="boot-bottom">
          <p class="boot-tip"><span class="boot-tip-text">Last one standing on the arena wins.</span></p>
          <div class="boot-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
          <div class="boot-meta"><span class="boot-status">Loading…</span><span class="boot-pct"></span></div>
          <p class="splash-tap">Tap to play</p>
        </div>
        <p class="splash-foot">A Best &amp; Ben game</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
