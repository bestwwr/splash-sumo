# Prod: Worker `splash-sumo` (API only; the client is served from GitHub Pages).
name = "splash-sumo"
main = "src/worker.ts"
compatibility_date = "2026-11-19"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

# Staging: Worker `splash-sumo-staging` serves the staging client AND the API.
[env.staging]
name = "splash-sumo-staging"
# API paths run the Worker first; everything else is served from the static assets.
assets = { directory = "../client/dist-staging", run_worker_first = ["/rooms", "/rooms/*", "/health"] }

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "MatchRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]
